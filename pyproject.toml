[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "carl-cam"
version = "0.1.0.dev0"
description = "Local-first live graphic camera for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "opencv-contrib-python>=5,<6",
    "cv2-enumerate-cameras>=1.4,<2",
    "PySide6>=6.8,<7",
    "mediapipe>=0.10,<0.11",
    "torch==2.14.1",
    "scikit-learn>=1.6,<2",
    "scipy>=1.15,<2",
    "pyvirtualcam>=0.14,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "Nuitka==4.1.1"]

[project.gui-scripts]
carl-cam = "carl_cam.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/carl_cam"]

# Windows wheels on PyPI are CPU-only. Use the official CUDA-enabled build
# for this desktop target; CPU training/inference still remain the default.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
